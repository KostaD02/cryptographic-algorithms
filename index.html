<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cryptographic algorithms</title>
    <meta name="title" content="Cryptographic algorithms K.D" />
    <meta name="description" content="Cryptographic algorithms UI" />
    <meta name="keywords" content="cryptography, algorithms" />
    <meta name="author" content="Konstantine Datunishvili" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://kostad02.github.io/cryptographic-algorithms/"
    />
    <meta property="og:title" content="Cryptographic algorithms - K.D" />
    <meta property="og:description" content="Cryptographic algorithms UI" />
    <meta
      property="og:image"
      content="https://konstantinedatunishvili.com/assets/images/logo_500x500.png"
    />
    <meta property="twitter:card" content=" summary_large_image" />
    <meta
      property="twitter:url"
      content="https://kostad02.github.io/cryptographic-algorithms/"
    />
    <meta property="twitter:title" content="Cryptographic algorithms - K.D" />
    <meta
      property="twitter:description"
      content="Cryptographic algorithms UI"
    />
    <meta
      property="twitter:image"
      content="https://konstantinedatunishvili.com/assets/images/logo_500x500.png"
    />
    <style>
      .matrix {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }

      .matrix-block {
        width: fit-content;
        border: 1px solid #ccc;
        padding: 10px;
        background: #f0f0f0;
        border-radius: 8px;
      }

      .matrix-block h4 {
        margin: 0 0 10px;
        font-size: 1rem;
        color: #333;
      }

      .matrix-table {
        border-collapse: collapse;
        margin: auto;
      }

      .matrix-table td {
        border: 1px solid #aaa;
        padding: 6px 10px;
        text-align: center;
        font-family: monospace;
        background: #fff;
      }
    </style>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://konstantinedatunishvili.com/assets/icons/favicon.ico"
    />
    <link rel="manifest" href="./manifest.json" />
  </head>
  <body>
    <main class="container-xxl pb-5">
      <h1 class="mt-3">Cryptographic algorithms</h1>
      <hr />
      <section class="mb-3">
        <h2 class="mb-3">Vernam algorithm</h2>
        <form id="vernam">
          <div class="form-floating mb-3">
            <input
              type="text"
              class="form-control"
              name="text"
              id="vernamText"
              placeholder="Text"
            />
            <label for="vernamText">Text</label>
          </div>
          <div class="form-floating mb-3">
            <input
              type="text"
              class="form-control"
              name="key"
              id="vernamKey"
              placeholder="Key"
            />
            <label for="vernamKey">Key</label>
          </div>
          <button class="btn btn-primary mb-3" type="submit">Encrypt</button>
          <div class="border rounded shadow-sm p-4" id="vernamResult">
            <p class="m-0">Waiting</p>
          </div>
        </form>
      </section>
      <section class="mb-3">
        <h2 class="mb-3">Frequency analysis</h2>
        <form id="frequency">
          <div class="form-floating mb-3">
            <textarea
              style="min-height: 150px; max-height: 400px"
              class="form-control"
              placeholder="Text to analyze"
              id="frequencyText"
              name="text"
            ></textarea>
            <label for="frequencyText">Text</label>
          </div>
          <button class="btn btn-primary mb-3">Analyze</button>
        </form>
        <h3 class="mb-3">Char frequency</h3>
        <div class="mb-3" style="max-height: 400px; overflow-y: auto">
          <table
            class="table table-responsive border rounded shadow-sm"
            id="frequencyCharResult"
            style="max-height: 400px"
          >
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Char</th>
                <th scope="col">Frequency</th>
                <th scope="col">%</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <h3 class="mb-3">Bigrams (Top 20)</h3>
        <div class="mb-3" style="max-height: 400px; overflow-y: auto">
          <table
            class="table table-responsive border rounded shadow-sm"
            id="frequencyBigramResult"
            style="max-height: 400px"
          >
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Bigram</th>
                <th scope="col">Count</th>
                <th scope="col">%</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <h3 class="mb-3">
          Guesses
          <span
            class="badge text-bg-warning"
            style="cursor: pointer; user-select: none"
            id="frequencyGuessesReset"
            tabindex="1"
          >
            Reset
          </span>
        </h3>
        <form
          class="mb-3 d-flex gap-3 flex-wrap"
          id="frequencyGuessesControl"
        ></form>
        <div id="frequencyGuessesResult" class="mb-3">
          <p class="mb-0">Waiting</p>
        </div>
        <div
          class="alert alert-danger d-none"
          id="frequencyGuessesResultError"
          role="alert"
        ></div>
      </section>
      <section class="mb-3">
        <h2 class="mb-3">Personal Cipher</h2>
        <form id="personal">
          <div class="form-floating mb-3">
            <input
              type="text"
              class="form-control"
              name="text"
              id="personalText"
              placeholder="Text"
            />
            <label for="personalText">Text</label>
          </div>
          <div class="form-floating mb-3">
            <input
              type="text"
              class="form-control"
              name="key"
              id="personalKey"
              placeholder="Key"
            />
            <label for="personalKey">Key</label>
          </div>
          <button class="btn btn-primary mb-3" type="submit">Encrypt</button>
          <div class="border rounded shadow-sm p-4" id="personalResult">
            <p class="m-0">Waiting</p>
          </div>
        </form>
        <h3 class="mb-3 mt-3">Matrix visualization</h3>
        <div class="matrix" id="personalMatrix"></div>
      </section>
    </main>
    <script src="./algoritms/vernam.js"></script>
    <script src="./algoritms/frequency.js"></script>
    <script src="./algoritms/personal.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
